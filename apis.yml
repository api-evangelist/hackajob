aid: hackajob
name: Hackajob
description: >-
  Hackajob is a UK-founded (2015) tech-recruitment platform that connects
  jobseekers and employers across the UK and US using AI hiring agents. Its
  flagship product, Archer, is an always-on AI sourcing agent that finds,
  qualifies, and introduces high-fit passive candidates directly into an
  employer's ATS, complemented by agents Chase (AI recruiter) and Thena
  (applicant screening). Alongside the AI agents it runs an On-Demand contract
  hiring marketplace, a Talent Intelligence / hiring-insights product, an Upskill
  skills-assessment tool, and public jobs and company directories drawing on a
  talent network of 1.5M+ vetted knowledge workers. Hackajob does not currently
  publish a public developer API or SDK; this profile captures its public web,
  security, and trust surface. Added to the API Evangelist network as a Techstars
  portfolio lead and enriched from real public sources.
